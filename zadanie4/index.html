<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cat</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <h1>Cat</h1>

    <figure class="hotspot-image">

      <img src="img/cat.jpg" alt="Image of a cat lying upside down in grass">

      <div class="hotspot" style="--x: 37%; --y: 27%">
        <button class="hotspot__dot" type="button" aria-label="Tongue"></button>
        <div class="hotspot__panel">
          <h2>Tongue</h2>
          <p>Pink tongue</p>
        </div>
      </div>

      <div class="hotspot" style="--x: 30.5%; --y: 59.5%">
        <button class="hotspot__dot" type="button" aria-label="Eye"></button>
        <div class="hotspot__panel">
          <h2>Eye</h2>
          <p>Green eye</p>
        </div>
      </div>

      <div class="hotspot" style="--x: 51%; --y: 35%">
        <button class="hotspot__dot" type="button" aria-label="Nose"></button>
        <div class="hotspot__panel">
          <h2>Nose</h2>
          <p>Wet nose</p>
        </div>
      </div>
    </figure>

    <p><a href="https://www.pexels.com/photo/silver-tabby-cat-lying-on-green-grass-160722/">Image source</a></p>
  </main>
</body>
</html>
